<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocal Stutter Transfer</title>
<style>
body{margin:0;background:#0d0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:700px;margin:auto;padding:20px 14px 40px}
.card{background:#19191f;border:1px solid #303038;border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:29px;margin:8px 0}p{color:#aaaab5;line-height:1.45}
label{display:block;font-weight:700;margin-bottom:9px}
input[type=file],textarea{width:100%;box-sizing:border-box;background:#101014;color:#fff;border:1px solid #34343d;border-radius:12px;padding:14px;font-size:16px}
textarea{height:95px}.row{display:flex;justify-content:space-between;margin-top:14px}
input[type=range]{width:100%}
button,a{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;color:#fff;text-decoration:none;background:linear-gradient(135deg,#8b5cf6,#635bff)}
.secondary{margin-top:10px;background:#292930}
#status{color:#aaaab5;margin-top:12px;white-space:pre-wrap}
</style></head>
<body><main>
<h1>Vocal Stutter Transfer</h1>
<p>Works from iPhone Safari. Select M4A, WAV, MP3, MP4, or MOV files. The server converts them with FFmpeg.</p>
<form id="f">
<div class="card"><label>1. Processed reference</label><input name="reference" type="file"></div>
<div class="card"><label>2. Dry vocal</label><input name="dry_vocal" type="file"></div>
<div class="card"><label>3. Style prompt</label><textarea name="prompt">Clean micro stutters, subtle, no pitch shift, no reverse, wet -8 dB, crossfade 8 ms.</textarea>
<div class="row"><span>Wet level</span><span id="wv">-8 dB</span></div><input id="wet" name="wet_db" type="range" min="-18" max="0" value="-8">
<div class="row"><span>Crossfade</span><span id="fv">8 ms</span></div><input id="fade" name="crossfade_ms" type="range" min="1" max="25" value="8">
<div class="row"><span>Density</span><span id="dv">1.00</span></div><input id="density" name="density" type="range" min=".25" max="1" step=".05" value="1">
<div class="row"><span>Strength</span><span id="sv">1.00</span></div><input id="strength" name="strength" type="range" min=".35" max="1.5" step=".05" value="1">
</div>
<div class="card"><button id="run">Analyze & Render</button><div id="status">Choose both files.</div>
<a id="save" class="secondary" style="display:none">Save WAV</a></div>
</form>
<script>
const $=x=>document.getElementById(x);
[["wet","wv",v=>v+" dB"],["fade","fv",v=>v+" ms"],["density","dv",v=>(+v).toFixed(2)],["strength","sv",v=>(+v).toFixed(2)]].forEach(([a,b,f])=>{
 const e=$(a),u=()=>$(b).textContent=f(e.value);e.oninput=u;u();
});
$("f").onsubmit=async e=>{
 e.preventDefault();const fd=new FormData(e.target);
 if(!fd.get("reference").name||!fd.get("dry_vocal").name){alert("Choose both files.");return}
 $("run").disabled=true;$("status").textContent="Uploading and processing… Keep Safari open.";
 try{
  const r=await fetch("/api/process",{method:"POST",body:fd});
  const j=await r.json();if(!r.ok)throw new Error(j.detail||"Failed");
  $("status").textContent=`Finished. ${j.event_count} reference events analyzed.`;
  $("save").href=j.download_url;$("save").style.display="block";
 }catch(err){$("status").textContent="Error: "+err.message}
 $("run").disabled=false;
};
</script></main></body></html>
