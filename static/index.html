<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocal Stutter Transfer</title><style>body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#2b0b5a,#5b21b6,#7c3aed);display:flex;justify-content:center;align-items:center;min-height:100vh;color:#fff}.card{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);padding:28px;border-radius:20px;width:min(92vw,560px)}input{width:100%;margin:8px 0 16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:bold}a{color:#fff}</style></head><body><div class="card"><h1>Vocal Stutter Transfer</h1><form id="form"><label>Reference Vocal</label><input id="reference" type="file" required><label>Dry Vocal</label><input id="dryVocal" type="file" required><button>Process Vocal</button></form><div id="status"></div><script>form.onsubmit=async(e)=>{e.preventDefault();const f=new FormData();f.append("reference",reference.files[0]);f.append("dry_vocal",dryVocal.files[0]);status.textContent="Uploading...";try{const r=await fetch("/api/process",{method:"POST",body:f});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Failed");status.innerHTML='Done<br><a href="'+d.download_url+'">Download processed WAV</a>';}catch(err){status.textContent=err.message;}}</script></div></body></html>
